<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SmartBoard Pro - الألوان الملكية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, 'Inter', sans-serif;
        }

        body {
            background-image: url('https://images7.alphacoders.com/133/1339670.png');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            position: relative;
            padding: 20px;
            color: #eef2ff;
        }

        /* الطبقة الشفافة - اللون الأرجواني الملكي */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(40, 10, 50, 0.75);
            backdrop-filter: blur(2px);
            z-index: -1;
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            padding: 45px 20px 35px;
            background: linear-gradient(135deg, rgba(30, 10, 40, 0.85) 0%, rgba(20, 5, 35, 0.9) 100%);
            border-radius: 64px;
            margin-bottom: 30px;
            border: 1px solid rgba(170, 102, 255, 0.5);
        }

        .hero .line1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(120deg, #e5b8ff, #c084fc, #a855f7);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 15px;
        }

        .hero .line2 {
            font-size: 2.8rem;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 0 15px #a855f7;
            margin-bottom: 18px;
        }

        .hero .line3 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #e2e8f0;
            border-top: 2px solid rgba(170, 102, 255, 0.6);
            display: inline-block;
            padding-top: 16px;
            font-style: italic;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero .line1, .hero .line2, .hero .line3 {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }
        .hero .line1 { animation-delay: 0s; }
        .hero .line2 { animation-delay: 0.15s; }
        .hero .line3 { animation-delay: 0.3s; }

        .dashboard {
            max-width: 1600px;
            margin: auto;
        }

        .card {
            background: rgba(20, 8, 30, 0.88);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 22px;
            margin-bottom: 22px;
            border: 1px solid rgba(170, 102, 255, 0.4);
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #1a0a2e;
            backdrop-filter: blur(4px);
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: bold;
            border: 1px solid #aa66ff;
            color: #e5b8ff;
            font-size: 0.9rem;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            margin-top: 16px;
            max-height: none;
            overflow: visible;
        }

        .skill-card {
            background: #1e1a2fdd;
            backdrop-filter: blur(5px);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid #7c3aed;
            transition: 0.2s;
            break-inside: avoid;
        }

        .skill-card:hover {
            transform: translateY(-3px);
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .skill-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: #f0e6ff;
        }

        .level-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0 12px;
        }

        .level-btn {
            background: #2d1a3e;
            border: none;
            border-radius: 40px;
            padding: 5px 11px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            color: #e0d0ff;
            transition: 0.15s;
        }

        .level-btn.active-level {
            background: #8b5cf6;
            color: white;
            box-shadow: 0 0 8px #a855f7;
        }

        .level-btn:hover {
            background: #a855f7;
            color: white;
        }

        .shared-resource-section, .sub-skill-block {
            background: #140a20d9;
            border-radius: 18px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #7c3aed;
        }

        .resource-input-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .resource-input {
            flex: 1;
            padding: 6px 10px;
            border-radius: 60px;
            border: 1px solid #8b5cf6;
            background: #1a0a2e;
            color: white;
            font-size: 0.73rem;
        }

        .resource-input:focus {
            outline: none;
            border-color: #c084fc;
        }

        .add-resource-btn, .add-normal-resource, .add-special-resource {
            background: #7c3aed;
            border: none;
            border-radius: 60px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 0.7rem;
            color: white;
            font-weight: bold;
        }

        .add-resource-btn:hover, .add-normal-resource:hover, .add-special-resource:hover {
            background: #a855f7;
        }

        .delete-resource, .delete-normal-resource, .delete-special-resource {
            background: none;
            border: none;
            color: #f472b6;
            font-size: 1rem;
            cursor: pointer;
        }

        .delete-resource:hover, .delete-normal-resource:hover, .delete-special-resource:hover {
            color: #f9a8d4;
        }

        .reset-skill-btn, .reset-progress, .reset-links {
            background: #2a1a3a;
            border: 1px solid #7c3aed;
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 0.65rem;
            cursor: pointer;
            font-weight: bold;
            color: #fbbf24;
        }

        .reset-skill-btn:hover, .reset-progress:hover, .reset-links:hover {
            background: #7c3aed;
            color: white;
        }

        .task-list li {
            background: #1a0a2ecc;
            margin: 6px 0;
            padding: 8px 16px;
            border-radius: 60px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            border: 1px solid #7c3aed;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }

        button:hover {
            background: #a855f7;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            opacity: 0.85;
            font-size: 0.75rem;
            color: #c0a0e0;
        }

        hr {
            border-color: #8b5cf6;
            margin: 15px 0;
        }

        .sub-skill-title {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            color: #fbbf24;
        }

        h2, h3 {
            color: #fbbf24;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .resource-label, .shared-resource-label {
            color: #d8b4fe;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="hero">
        <div class="line1">“Ten billion percent, we're gonna make it”</div>
        <div class="line2">Fight... or be forgotten</div>
        <div class="line3">“My magic is never giving up”</div>
    </div>

    <div class="card">
        <h2>📊 لوحة تطور المهارات - بركة القرآن 🌙</h2>
        <div class="stats" id="statsArea"></div>
        <div class="skills-grid" id="skillsGrid"></div>
        
        <hr>
        <h3>📝 مهامي اليومية</h3>
        <div class="task-input" style="display:flex; gap:8px; margin:12px 0;">
            <input type="text" id="taskName" class="resource-input" placeholder="أضف مهمة جديدة...">
            <button id="addTask">➕ أضف</button>
        </div>
        <ul class="task-list" id="taskList"></ul>
        <button id="resetAllBtn" style="background:#6d28d9; margin-top:8px;">🔄 إعادة تعيين الكل</button>
    </div>
    <footer>👑 الألوان الملكية | اللهم اجعل القرآن العظيم ربيع قلوبنا 👑</footer>
</div>

<script>
    // =====================================================
    // 1. المهارات الأساسية (المواد العادية) 18 مهارة
    // =====================================================
    const basicSkills = [
        "Data Analytics", "Time Management", "Communication", "Creative Thinking",
        "Social Skills", "Branding", "Budgeting", "Business Management",
        "Leadership", "Public Speaking", "Calculating Risks", "Sales",
        "Marketing", "Human Psychology", "Presenting", "Creating System",
        "Web Development", "Mobile Development"
    ];
    const normalLevels = [0, 25, 50, 75, 100];
    
    // =====================================================
    // 2. المهارات المتقدمة (مع روابط خاصة لكل مستوى)
    // =====================================================
    const chessSkill = {
        name: "♟️ الشطرنج (Chess)",
        subSkills: {
            "Rapid": ["800-1200", "1200-1500", "1500-1800"],
            "Blitz": ["600-800", "800-1200", "1200-1500", "1500-1800"],
            "Bullet": ["400-600", "600-800", "800-1200", "1200-1500", "1500-1800"]
        }
    };
    
    const englishSkill = {
        name: "🇬🇧 English",
        subSkills: {
            "Pronunciation": ["A1","A2","B1","B2","C1","C2"],
            "Writing": ["A1","A2","B1","B2","C1","C2"]
        }
    };
    
    const deutschSkill = {
        name: "🇩🇪 Deutsch (German)",
        subSkills: {
            "Pronunciation": ["A1","A2","B1","B2","C1","C2"],
            "Writing": ["A1","A2","B1","B2","C1","C2"]
        }
    };
    
    const sportSkill = {
        name: "🏃 الرياضة (Sport)",
        subSkills: {
            "Running": ["10-12","12-15","15-18","18-21"],
            "Push Up": ["30-35","35-40","40-45","45-50","55-60"],
            "Pull Up": ["10-15","15-20","20-25","25-30"],
            "Squat": ["50-100","100-150","150-200","200-250"]
        }
    };
    
    const simulationSkill = {
        name: "🧪 Simulation physicochimique",
        subSkills: {
            "Niveau": ["débutant","amateur","intermédiaire","expert"]
        }
    };
    
    // =====================================================
    // 3. مهارة حفظ القرآن الكريم (14 مستوى للحفظ + 5 للمراجعة)
    // =====================================================
    const quranSkill = {
        name: "📖 حفظ القرآن الكريم",
        subSkills: {
            "الحفظ الجديد": [
                "1 جزء", "2 جزء", "3 جزء", "4 جزء", "5 جزء",
                "6 جزء", "7 جزء", "8 جزء", "9 جزء", "10 جزء",
                "11-15 جزء", "16-20 جزء", "21-25 جزء", "26-30 جزء"
            ],
            "المراجعة": ["ضعيف", "متوسط", "جيد", "ممتاز", "متقن"]
        }
    };
    
    // ترتيب جميع المهارات المتقدمة (6 مهارات)
    const specialSkillsOrder = [chessSkill, englishSkill, deutschSkill, sportSkill, simulationSkill, quranSkill];
    
    // =====================================================
    // البيانات والتخزين المحلي
    // =====================================================
    let normalProgress = JSON.parse(localStorage.getItem("normalProgress")) || {};
    let specialProgress = JSON.parse(localStorage.getItem("specialProgress")) || {};
    let resources = JSON.parse(localStorage.getItem("allResources")) || {};
    let tasks = JSON.parse(localStorage.getItem("learningTasks")) || [];
    
    function initData() {
        basicSkills.forEach(s => { if (normalProgress[s] === undefined) normalProgress[s] = 0; });
        specialSkillsOrder.forEach(skill => {
            if (!specialProgress[skill.name]) specialProgress[skill.name] = {};
            for (let sub in skill.subSkills) {
                if (!specialProgress[skill.name][sub]) {
                    specialProgress[skill.name][sub] = skill.subSkills[sub][0];
                }
            }
        });
    }
    
    function getNormalResourceKey(skill) { return `normal_${skill}`; }
    function getSpecialResourceKey(skill, sub, lvl) { return `special_${skill}_${sub}_${lvl}`; }
    
    function saveAll() {
        localStorage.setItem("normalProgress", JSON.stringify(normalProgress));
        localStorage.setItem("specialProgress", JSON.stringify(specialProgress));
        localStorage.setItem("allResources", JSON.stringify(resources));
        localStorage.setItem("learningTasks", JSON.stringify(tasks));
    }
    
    // ========== إدارة الموارد ==========
    function addNormalResource(skill) {
        let inp = document.getElementById(`normal-res-${skill.replace(/\s/g, '')}`);
        if(!inp || !inp.value.trim()) return;
        let url = inp.value.trim();
        if(!url.startsWith("http")) url = "https://"+url;
        let key = getNormalResourceKey(skill);
        if(!resources[key]) resources[key] = [];
        resources[key].push(url);
        saveAll(); renderSkills(); updateStats();
        inp.value = "";
    }
    
    function deleteNormalResource(skill, idx) {
        if(confirm("⚠️ هل أنت متأكد من حذف هذا الرابط نهائياً؟")){
            let key = getNormalResourceKey(skill);
            if(resources[key]) resources[key].splice(idx,1);
            if(resources[key]?.length===0) delete resources[key];
            saveAll(); renderSkills(); updateStats();
        }
    }
    
    function deleteAllNormalResources(skill) {
        if(confirm(`⚠️ هل تريد حذف جميع روابط "${skill}" نهائياً؟`)){
            delete resources[getNormalResourceKey(skill)];
            saveAll(); renderSkills(); updateStats();
        }
    }
    
    function addSpecialResource(skill, sub, lvl) {
        let inp = document.getElementById(`special-res-${skill.replace(/\s/g, '')}-${sub}`);
        if(!inp || !inp.value.trim()) return;
        let url = inp.value.trim();
        if(!url.startsWith("http")) url = "https://"+url;
        let key = getSpecialResourceKey(skill, sub, lvl);
        if(!resources[key]) resources[key] = [];
        resources[key].push(url);
        saveAll(); renderSkills(); updateStats();
        inp.value = "";
    }
    
    function deleteSpecialResource(skill, sub, lvl, idx) {
        if(confirm("⚠️ هل أنت متأكد من حذف هذا الرابط نهائياً؟")){
            let key = getSpecialResourceKey(skill, sub, lvl);
            if(resources[key]) resources[key].splice(idx,1);
            if(resources[key]?.length===0) delete resources[key];
            saveAll(); renderSkills(); updateStats();
        }
    }
    
    function deleteAllSpecialLevel(skill, sub, lvl) {
        if(confirm(`⚠️ هل تريد حذف جميع روابط "${skill} - ${sub} - ${lvl}" نهائياً؟`)){
            delete resources[getSpecialResourceKey(skill, sub, lvl)];
            saveAll(); renderSkills(); updateStats();
        }
    }
    
    function resetNormalSkill(skill) {
        if(confirm(`🔄 إعادة ضبط "${skill}" إلى 0%؟`)){ 
            normalProgress[skill]=0; 
            saveAll(); renderSkills(); updateStats();
        }
    }
    
    function resetSubProgress(skill, sub, arr) {
        if(confirm(`🔄 إعادة ضبط تقدم "${skill} - ${sub}" إلى المستوى الأول (${arr[0]})؟`)){
            specialProgress[skill][sub] = arr[0];
            saveAll(); renderSkills(); updateStats();
        }
    }
    
    // ========== الإحصائيات ==========
    function updateStats() {
        let totalCount = 0, totalSum = 0;
        basicSkills.forEach(s => { totalSum += normalProgress[s] || 0; totalCount++; });
        
        specialSkillsOrder.forEach(sk => {
            let subSum=0, subC=0;
            for(let sub in sk.subSkills){
                let lvl = specialProgress[sk.name]?.[sub];
                let arr = sk.subSkills[sub];
                if(lvl && arr.includes(lvl)){
                    let idx = arr.indexOf(lvl);
                    subSum += (idx/(arr.length-1))*100;
                }
                subC++;
            }
            if(subC){ totalSum += subSum; totalCount++; }
        });
        
        let avg = totalCount? Math.round(totalSum/totalCount):0;
        let completed = basicSkills.filter(s => normalProgress[s]===100).length;
        
        specialSkillsOrder.forEach(sk => {
            let ok=true;
            for(let sub in sk.subSkills){
                let arr = sk.subSkills[sub];
                if(specialProgress[sk.name]?.[sub] !== arr[arr.length-1]) ok=false;
            }
            if(ok) completed++;
        });
        
        let tasksDone = tasks.filter(t=>t.done).length;
        document.getElementById("statsArea").innerHTML = `
            <div class="stat-box">📊 متوسط التقدم: ${avg}%</div>
            <div class="stat-box">🏆 مهارات كاملة: ${completed}/${totalCount}</div>
            <div class="stat-box">✅ مهام منجزة: ${tasksDone}/${tasks.length}</div>
        `;
    }
    
    // ========== عرض جميع المهارات (الكامل) ==========
    function renderSkills() {
        const grid = document.getElementById("skillsGrid");
        if(!grid) return;
        grid.innerHTML = "";
        
        // 1. المواد الأساسية (18 مهارة)
        basicSkills.forEach(skill => {
            let cur = normalProgress[skill] || 0;
            let resKey = getNormalResourceKey(skill);
            let resList = resources[resKey] || [];
            let levelsHtml = normalLevels.map(lvl => `<button class="level-btn ${cur===lvl ? 'active-level' : ''}" data-skill="${skill}" data-level="${lvl}">${lvl}%</button>`).join('');
            let resourcesHtml = resList.map((r,i)=>`<li class="resource-item"><a href="${r}" target="_blank" class="resource-link">📖 ${r.length>35?r.slice(0,35)+'...':r}</a><button class="delete-normal-resource" data-skill="${skill}" data-idx="${i}">✖</button></li>`).join('');
            let card = document.createElement("div"); card.className="skill-card";
            card.innerHTML = `
                <div class="skill-header"><span class="skill-name">${skill}</span><button class="reset-skill-btn" data-skill-normal="${skill}">🔄 إعادة ضبط التقدم</button></div>
                <div class="level-buttons">${levelsHtml}</div>
                <div class="shared-resource-section"><div class="shared-resource-label">📚 مصادر مشتركة:</div>
                <div class="resource-input-group"><input type="text" id="normal-res-${skill.replace(/\s/g, '')}" class="resource-input" placeholder="رابط فيديو/ملف"><button class="add-normal-resource" data-skill="${skill}">➕ أضف</button>${resList.length?`<button class="reset-links-btn" data-skill-normal-resetlinks="${skill}" style="background:#6d28d9;">🗑️ مسح الكل</button>`:''}</div>
                <ul class="resources-list">${resourcesHtml}</ul></div>
            `;
            grid.appendChild(card);
        });
        
        // 2. المهارات المتقدمة (6 مهارات: شطرنج، إنجليزي، ألماني، رياضة، محاكاة، قرآن)
        specialSkillsOrder.forEach(skillObj => {
            let card = document.createElement("div"); card.className="skill-card";
            let inner = `<div class="skill-header"><span class="skill-name">${skillObj.name}</span></div>`;
            
            for(let [subName, levelsArr] of Object.entries(skillObj.subSkills)){
                let current = specialProgress[skillObj.name]?.[subName] || levelsArr[0];
                let btns = levelsArr.map(lvl => `<button class="level-btn special-level ${current===lvl?'active-level':''}" data-skill-name="${skillObj.name}" data-sub-skill="${subName}" data-level="${lvl}">${lvl}</button>`).join('');
                let resKey = getSpecialResourceKey(skillObj.name, subName, current);
                let resList = resources[resKey] || [];
                let resHtml = resList.map((r,i)=>`<li class="resource-item"><a href="${r}" target="_blank" class="resource-link">📖 ${r.length>35?r.slice(0,35)+'...':r}</a><button class="delete-special-resource" data-skill-name="${skillObj.name}" data-sub-skill="${subName}" data-level="${current}" data-idx="${i}">✖</button></li>`).join('');
                
                inner += `<div class="sub-skill-block">
                    <div class="sub-skill-title">
                        <span>📌 ${subName}</span>
                        <div>
                            <button class="level-control-btn reset-progress reset-progress-special" data-skill-name="${skillObj.name}" data-sub-skill="${subName}">🔄 إعادة ضبط التقدم</button>
                            <button class="level-control-btn reset-links reset-links-special" data-skill-name="${skillObj.name}" data-sub-skill="${subName}" data-level="${current}">🗑️ مسح روابط هذا المستوى</button>
                        </div>
                    </div>
                    <div class="level-buttons">${btns}</div>
                    <div class="resource-section-special">
                        <div class="resource-label" style="font-size:0.7rem;">📚 روابط خاصة بهذا المستوى (${current}):</div>
                        <div class="resource-input-group">
                            <input type="text" id="special-res-${skillObj.name.replace(/\s/g, '')}-${subName}" class="resource-input" placeholder="رابط فيديو/تلاوة/تفسير">
                            <button class="add-special-resource" data-skill-name="${skillObj.name}" data-sub-skill="${subName}" data-level="${current}">➕ أضف</button>
                        </div>
                        <ul class="resources-list">${resHtml}</ul>
                    </div>
                </div>`;
            }
            card.innerHTML = inner;
            grid.appendChild(card);
        });
        
        // ربط الأحداث
        attachEvents();
    }
    
    function attachEvents() {
        // أحداث المواد الأساسية
        document.querySelectorAll(".level-btn[data-skill]").forEach(btn=>btn.addEventListener("click",e=>{
            let s=btn.getAttribute("data-skill"), lvl=parseInt(btn.getAttribute("data-level"));
            if(s){ normalProgress[s]=lvl; saveAll(); renderSkills(); updateStats(); }
        }));
        document.querySelectorAll(".reset-skill-btn[data-skill-normal]").forEach(btn=>btn.addEventListener("click",e=>resetNormalSkill(btn.getAttribute("data-skill-normal"))));
        document.querySelectorAll(".add-normal-resource").forEach(btn=>btn.addEventListener("click",e=>addNormalResource(btn.getAttribute("data-skill"))));
        document.querySelectorAll(".delete-normal-resource").forEach(btn=>btn.addEventListener("click",e=>deleteNormalResource(btn.getAttribute("data-skill"), parseInt(btn.getAttribute("data-idx")))));
        document.querySelectorAll(".reset-links-btn[data-skill-normal-resetlinks]").forEach(btn=>btn.addEventListener("click",e=>deleteAllNormalResources(btn.getAttribute("data-skill-normal-resetlinks"))));
        
        // أحداث المهارات المتقدمة
        document.querySelectorAll(".special-level").forEach(btn=>btn.addEventListener("click",e=>{
            let sn=btn.getAttribute("data-skill-name"), sub=btn.getAttribute("data-sub-skill"), lvl=btn.getAttribute("data-level");
            if(sn && sub){ specialProgress[sn][sub]=lvl; saveAll(); renderSkills(); updateStats(); }
        }));
        document.querySelectorAll(".reset-progress-special").forEach(btn=>btn.addEventListener("click",e=>{
            let sn=btn.getAttribute("data-skill-name"), sub=btn.getAttribute("data-sub-skill");
            let found = specialSkillsOrder.find(s=>s.name===sn);
            if(found && found.subSkills[sub]) resetSubProgress(sn, sub, found.subSkills[sub]);
        }));
        document.querySelectorAll(".reset-links-special").forEach(btn=>btn.addEventListener("click",e=>{
            let sn=btn.getAttribute("data-skill-name"), sub=btn.getAttribute("data-sub-skill"), lvl=btn.getAttribute("data-level");
            if(sn && sub && lvl) deleteAllSpecialLevel(sn, sub, lvl);
        }));
        document.querySelectorAll(".add-special-resource").forEach(btn=>btn.addEventListener("click",e=>{
            let sn=btn.getAttribute("data-skill-name"), sub=btn.getAttribute("data-sub-skill"), lvl=btn.getAttribute("data-level");
            addSpecialResource(sn, sub, lvl);
        }));
        document.querySelectorAll(".delete-special-resource").forEach(btn=>btn.addEventListener("click",e=>{
            let sn=btn.getAttribute("data-skill-name"), sub=btn.getAttribute("data-sub-skill"), lvl=btn.getAttribute("data-level"), idx=parseInt(btn.getAttribute("data-idx"));
            deleteSpecialResource(sn, sub, lvl, idx);
        }));
    }
    
    // ========== إدارة المهام ==========
    function renderTasks() {
        let ul = document.getElementById("taskList");
        if(!ul) return;
        if(tasks.length===0){ ul.innerHTML="<li style='text-align:center;'>✨ لا توجد مهام | أضف مهمة جديدة</li>"; return; }
        ul.innerHTML = tasks.map((t,i)=>`<li style="text-decoration:${t.done?'line-through':'none'}; opacity:${t.done?0.6:1}"><span>${t.name}</span><div><button class="toggleTask" data-idx="${i}">${t.done?'↩️ تراجع':'✔ أنجزت'}</button><button class="deleteTask" data-idx="${i}">🗑</button></div></li>`).join('');
        document.querySelectorAll(".toggleTask").forEach(btn=>btn.addEventListener("click",e=>{let idx=btn.getAttribute("data-idx"); tasks[idx].done=!tasks[idx].done; saveAll(); renderTasks(); updateStats();}));
        document.querySelectorAll(".deleteTask").forEach(btn=>btn.addEventListener("click",e=>{if(confirm("⚠️ حذف المهمة؟")){ let idx=btn.getAttribute("data-idx"); tasks.splice(idx,1); saveAll(); renderTasks(); updateStats();}}));
    }
    
    document.getElementById("addTask")?.addEventListener("click",()=>{
        let inp=document.getElementById("taskName");
        if(inp.value.trim()){ tasks.push({name:inp.value.trim(),done:false}); saveAll(); renderTasks(); updateStats(); inp.value=""; }
    });
    
    document.getElementById("resetAllBtn")?.addEventListener("click",()=>{
        if(confirm("⚠️ تحذير نهائي: سيتم حذف كل تقدم المهارات، جميع المصادر، وجميع المهام. هل أنت متأكد؟")){
            basicSkills.forEach(s=>normalProgress[s]=0);
            specialSkillsOrder.forEach(skill=>{
                for(let sub in skill.subSkills) specialProgress[skill.name][sub]=skill.subSkills[sub][0];
            });
            resources={}; tasks=[]; saveAll(); renderSkills(); renderTasks(); updateStats();
        }
    });
    
    initData(); renderSkills(); renderTasks(); updateStats();
</script>
</body>
</html>
