<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SmartBoard Pro - Toji Zenin System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, 'Inter', sans-serif;
        }

        body {
            background-image: url('https://images7.alphacoders.com/133/1339670.png');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            position: relative;
            padding: 20px;
            color: #eef2ff;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(40, 10, 50, 0.75);
            backdrop-filter: blur(2px);
            z-index: -1;
        }

        /* Solo Leveling XP Card - Toji Style */
        .xp-card {
            background: linear-gradient(135deg, #0a0a1a, #050510);
            border-radius: 28px;
            padding: 16px 24px;
            margin-bottom: 25px;
            border: 2px solid #fbbf24;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .xp-card.glow {
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.8);
            border-color: #f59e0b;
        }

        .level-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .rank-icon {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 10px #fbbf24);
        }

        .rank-text {
            text-align: center;
        }

        .rank-name {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(120deg, #fbbf24, #f59e0b);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .rank-title {
            font-size: 0.8rem;
            color: #d8b4fe;
        }

        .xp-stats {
            flex: 1;
            min-width: 200px;
        }

        .xp-bar-container {
            background: #2d1a3e;
            border-radius: 60px;
            height: 16px;
            overflow: hidden;
            margin: 8px 0;
        }

        .xp-bar-fill {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            width: 0%;
            height: 100%;
            border-radius: 60px;
            transition: width 0.5s ease;
        }

        .xp-numbers {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #e0d0ff;
        }

        .next-level {
            font-size: 0.7rem;
            color: #fbbf24;
        }

        .achievement-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #1a0a2e, #2d1a3e);
            border-right: 5px solid #fbbf24;
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            animation: slideIn 0.5s ease forwards;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .achievement-toast.fade-out {
            animation: fadeOut 0.5s ease forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateX(100%); }
        }

        .hero {
            text-align: center;
            padding: 35px 20px 25px;
            background: linear-gradient(135deg, rgba(30, 10, 40, 0.85) 0%, rgba(20, 5, 35, 0.9) 100%);
            border-radius: 64px;
            margin-bottom: 20px;
            border: 1px solid rgba(170, 102, 255, 0.5);
        }

        .hero .line1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(120deg, #e5b8ff, #c084fc, #a855f7);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .hero .line2 {
            font-size: 2.5rem;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 0 15px #a855f7;
        }

        .hero .line3 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #e2e8f0;
            border-top: 2px solid rgba(170, 102, 255, 0.6);
            display: inline-block;
            padding-top: 12px;
        }

        .dashboard {
            max-width: 1600px;
            margin: auto;
        }

        .card {
            background: rgba(20, 8, 30, 0.88);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 22px;
            margin-bottom: 22px;
            border: 1px solid rgba(170, 102, 255, 0.4);
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #1a0a2e;
            backdrop-filter: blur(4px);
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: bold;
            border: 1px solid #aa66ff;
            color: #e5b8ff;
            font-size: 0.9rem;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }

        .skill-card {
            background: #1e1a2fdd;
            backdrop-filter: blur(5px);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid #7c3aed;
            transition: 0.2s;
        }

        .skill-card:hover {
            transform: translateY(-3px);
            border-color: #a855f7;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .skill-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: #f0e6ff;
        }

        .level-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0 12px;
        }

        .level-btn {
            background: #2d1a3e;
            border: none;
            border-radius: 40px;
            padding: 5px 11px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            color: #e0d0ff;
            transition: 0.15s;
        }

        .level-btn.active-level {
            background: #8b5cf6;
            color: white;
            box-shadow: 0 0 8px #a855f7;
        }

        .level-btn:hover {
            background: #a855f7;
            color: white;
        }

        .shared-resource-section, .sub-skill-block {
            background: #140a20d9;
            border-radius: 18px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #7c3aed;
        }

        .resource-input-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .resource-input {
            flex: 1;
            padding: 6px 10px;
            border-radius: 60px;
            border: 1px solid #8b5cf6;
            background: #1a0a2e;
            color: white;
            font-size: 0.73rem;
        }

        .add-resource-btn, .add-normal-resource, .add-special-resource {
            background: #7c3aed;
            border: none;
            border-radius: 60px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 0.7rem;
            color: white;
            font-weight: bold;
        }

        .delete-resource, .delete-normal-resource, .delete-special-resource {
            background: none;
            border: none;
            color: #f472b6;
            font-size: 1rem;
            cursor: pointer;
        }

        .reset-skill-btn, .reset-progress, .reset-links {
            background: #2a1a3a;
            border: 1px solid #7c3aed;
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 0.65rem;
            cursor: pointer;
            font-weight: bold;
            color: #fbbf24;
        }

        .task-list li {
            background: #1a0a2ecc;
            margin: 6px 0;
            padding: 8px 16px;
            border-radius: 60px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            border: 1px solid #7c3aed;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            opacity: 0.85;
            font-size: 0.75rem;
            color: #c0a0e0;
        }

        hr {
            border-color: #8b5cf6;
            margin: 15px 0;
        }

        .sub-skill-title {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            color: #fbbf24;
        }

        h2, h3 {
            color: #fbbf24;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="hero">
        <div class="line1">“Ten billion percent, we're gonna make it”</div>
        <div class="line2">Fight... or be forgotten</div>
        <div class="line3">“My magic is never giving up”</div>
    </div>

    <!-- Toji Zenin XP Card -->
    <div class="xp-card" id="xpCard">
        <div class="level-info">
            <div class="rank-icon" id="rankIcon">🚫</div>
            <div class="rank-text">
                <div class="rank-name" id="rankName">المنبوذ</div>
                <div class="rank-title" id="rankTitle">The Outcast</div>
            </div>
        </div>
        <div class="xp-stats">
            <div class="xp-numbers">
                <span>🗡️ <span id="currentXP">0</span> XP</span>
                <span>🎯 <span id="nextLevelXP">800</span> XP</span>
            </div>
            <div class="xp-bar-container">
                <div class="xp-bar-fill" id="xpBarFill" style="width: 0%;"></div>
            </div>
            <div class="next-level" id="nextLevelText">📈 التالي: الساقط (800 XP)</div>
        </div>
    </div>

    <div class="card">
        <h2>📊 لوحة تطور المهارات - بركة القرآن 🌙</h2>
        <div class="stats" id="statsArea"></div>
        <div class="skills-grid" id="skillsGrid"></div>
        
        <hr>
        <h3>📝 مهامي اليومية</h3>
        <div class="task-input" style="display:flex; gap:8px; margin:12px 0;">
            <input type="text" id="taskName" class="resource-input" placeholder="أضف مهمة جديدة...">
            <button id="addTask">➕ أضف</button>
        </div>
        <ul class="task-list" id="taskList"></ul>
        <button id="resetAllBtn" style="background:#6d28d9; margin-top:8px;">🔄 إعادة تعيين الكل</button>
    </div>
    <footer>⚡ نظام الترقية - مستوحى من توجي زينين ⚡</footer>
</div>

<script>
    // =====================================================
    // نظام الألقاب المستوحى من توجي زينين (13 مستوى)
    // =====================================================
    const RANKS = [
        { name: "المنبوذ", en: "The Outcast", xpRequired: 0, icon: "🚫", nextXp: 800 },
        { name: "الساقط", en: "The Fallen", xpRequired: 800, icon: "💔", nextXp: 1800 },
        { name: "الصياد", en: "The Hunter", xpRequired: 1800, icon: "🎯", nextXp: 3200 },
        { name: "قاتل السحرة", en: "Sorcerer Killer", xpRequired: 3200, icon: "🗡️", nextXp: 5200 },
        { name: "الظل الأعمى", en: "Blind Shadow", xpRequired: 5200, icon: "🌑", nextXp: 7800 },
        { name: "السيف المخفي", en: "Hidden Blade", xpRequired: 7800, icon: "⚔️", nextXp: 11000 },
        { name: "القاتل الخارق", en: "Heavenly Restriction", xpRequired: 11000, icon: "🔥", nextXp: 15000 },
        { name: "محارب الزنزانة", en: "Prison Realm Warrior", xpRequired: 15000, icon: "⛓️", nextXp: 20000 },
        { name: "العينان السوداوان", en: "Black Eyes", xpRequired: 20000, icon: "👁️🗡️", nextXp: 26000 },
        { name: "شيطان الزنزانة", en: "Prison Demon", xpRequired: 26000, icon: "😈", nextXp: 34000 },
        { name: "الهيمنة المطلقة", en: "Absolute Dominance", xpRequired: 34000, icon: "👑", nextXp: 44000 },
        { name: "الأسطورة المنسية", en: "Forgotten Legend", xpRequired: 44000, icon: "📜", nextXp: 60000 },
        { name: "توجي - القاتل الأعلى", en: "Toji - Supreme Slayer", xpRequired: 60000, icon: "⚡🗡️", nextXp: null }
    ];

    // الإنجازات
    const ACHIEVEMENTS = [
        { id: "first_100", name: "🎯 أول 100%", description: "أول مهارة تصل إلى 100%", xpReward: 500, achieved: false },
        { id: "five_skills", name: "🌟 5 مهارات كاملة", description: "5 مهارات بمستوى 100%", xpReward: 1000, achieved: false },
        { id: "ten_skills", name: "🏆 10 مهارات كاملة", description: "10 مهارات بمستوى 100%", xpReward: 2000, achieved: false },
        { id: "all_normal", name: "💪 إتقان الأساسيات", description: "جميع المواد العادية 100%", xpReward: 3000, achieved: false },
        { id: "quran_master", name: "📖 حافظ القرآن", description: "إتقان حفظ القرآن", xpReward: 2500, achieved: false }
    ];

    let userXP = 0;
    let currentRankIndex = 0;
    let achievements = JSON.parse(localStorage.getItem("achievements")) || ACHIEVEMENTS.map(a => ({ ...a, achieved: false }));

    // =====================================================
    // المهارات (نفس الكود السابق)
    // =====================================================
    const basicSkills = [
        "Data Analytics", "Time Management", "Communication", "Creative Thinking",
        "Social Skills", "Branding", "Budgeting", "Business Management",
        "Leadership", "Public Speaking", "Calculating Risks", "Sales",
        "Marketing", "Human Psychology", "Presenting", "Creating System",
        "Web Development", "Mobile Development"
    ];
    const normalLevels = [0, 25, 50, 75, 100];
    
    const chessSkill = {
        name: "♟️ الشطرنج (Chess)",
        subSkills: {
            "Rapid": ["800-1200", "1200-1500", "1500-1800"],
            "Blitz": ["600-800", "800-1200", "1200-1500", "1500-1800"],
            "Bullet": ["400-600", "600-800", "800-1200", "1200-1500", "1500-1800"]
        }
    };
    
    const englishSkill = {
        name: "🇬🇧 English",
        subSkills: {
            "Pronunciation": ["A1","A2","B1","B2","C1","C2"],
            "Writing": ["A1","A2","B1","B2","C1","C2"]
        }
    };
    
    const deutschSkill = {
        name: "🇩🇪 Deutsch (German)",
        subSkills: {
            "Pronunciation": ["A1","A2","B1","B2","C1","C2"],
            "Writing": ["A1","A2","B1","B2","C1","C2"]
        }
    };
    
    const sportSkill = {
        name: "🏃 الرياضة (Sport)",
        subSkills: {
            "Running": ["10-12","12-15","15-18","18-21"],
            "Push Up": ["30-35","35-40","40-45","45-50","55-60"],
            "Pull Up": ["10-15","15-20","20-25","25-30"],
            "Squat": ["50-100","100-150","150-200","200-250"]
        }
    };
    
    const simulationSkill = {
        name: "🧪 Simulation physicochimique",
        subSkills: {
            "Niveau": ["débutant","amateur","intermédiaire","expert"]
        }
    };
    
    const quranSkill = {
        name: "📖 حفظ القرآن الكريم",
        subSkills: {
            "الحفظ الجديد": [
                "1 جزء", "2 جزء", "3 جزء", "4 جزء", "5 جزء",
                "6 جزء", "7 جزء", "8 جزء", "9 جزء", "10 جزء",
                "11-15 جزء", "16-20 جزء", "21-25 جزء", "26-30 جزء"
            ],
            "المراجعة": ["ضعيف", "متوسط", "جيد", "ممتاز", "متقن"]
        }
    };
    
    const specialSkillsOrder = [chessSkill, englishSkill, deutschSkill, sportSkill, simulationSkill, quranSkill];
    
    let normalProgress = JSON.parse(localStorage.getItem("normalProgress")) || {};
    let specialProgress = JSON.parse(localStorage.getItem("specialProgress")) || {};
    let resources = JSON.parse(localStorage.getItem("allResources")) || {};
    let tasks = JSON.parse(localStorage.getItem("learningTasks")) || [];
    
    userXP = parseInt(localStorage.getItem("userXP")) || 0;
    
    // حساب XP من المهارات
    function calculateTotalXP() {
        let totalXP = 0;
        basicSkills.forEach(skill => {
            let progress = normalProgress[skill] || 0;
            totalXP += Math.floor(progress * 10);
        });
        specialSkillsOrder.forEach(skill => {
            for (let sub in skill.subSkills) {
                let current = specialProgress[skill.name]?.[sub];
                let levelsArr = skill.subSkills[sub];
                if (current && levelsArr.includes(current)) {
                    let index = levelsArr.indexOf(current);
                    let percent = (index / (levelsArr.length - 1)) * 100;
                    totalXP += Math.floor(percent * 10);
                }
            }
        });
        return totalXP;
    }

    // تحديث المستوى بناءً على XP
    function updateRank() {
        let newIndex = 0;
        for (let i = RANKS.length - 1; i >= 0; i--) {
            if (userXP >= RANKS[i].xpRequired) {
                newIndex = i;
                break;
            }
        }
        
        if (newIndex !== currentRankIndex) {
            currentRankIndex = newIndex;
            showLevelUpMessage(RANKS[currentRankIndex].name, RANKS[currentRankIndex].icon);
            const xpCard = document.getElementById('xpCard');
            xpCard.classList.add('glow');
            setTimeout(() => xpCard.classList.remove('glow'), 2000);
        }
        
        const rank = RANKS[currentRankIndex];
        document.getElementById('rankName').innerHTML = rank.name;
        document.getElementById('rankTitle').innerHTML = rank.en;
        document.getElementById('rankIcon').innerHTML = rank.icon;
        
        let currentLevelXP = rank.xpRequired;
        let nextLevelXP = rank.nextXp || userXP;
        let xpInLevel = userXP - currentLevelXP;
        let xpNeededForNext = (rank.nextXp || userXP) - currentLevelXP;
        let percent = (xpInLevel / xpNeededForNext) * 100;
        
        document.getElementById('xpBarFill').style.width = Math.min(100, Math.max(0, percent)) + '%';
        document.getElementById('currentXP').innerText = userXP;
        
        if (rank.nextXp) {
            document.getElementById('nextLevelXP').innerText = rank.nextXp;
            document.getElementById('nextLevelText').innerHTML = `📈 التالي: ${RANKS[currentRankIndex+1]?.name || 'MAX'} (${rank.nextXp} XP)`;
        } else {
            document.getElementById('nextLevelXP').innerText = 'MAX';
            document.getElementById('nextLevelText').innerHTML = `👑 أنت في القمة! ${rank.name} 👑`;
        }
    }

    function showLevelUpMessage(rankName, icon) {
        const toast = document.createElement('div');
        toast.className = 'achievement-toast';
        toast.innerHTML = `
            <span style="font-size: 2rem;">${icon}</span>
            <div>
                <div style="font-weight: bold; color: #fbbf24;">🗡️ LEVEL UP! 🗡️</div>
                <div>لقد أصبحت ${rankName}</div>
            </div>
        `;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.classList.add('fade-out');
            setTimeout(() => toast.remove(), 500);
        }, 3000);
    }

    function showAchievement(achievementName, xpReward) {
        const toast = document.createElement('div');
        toast.className = 'achievement-toast';
        toast.innerHTML = `
            <span style="font-size: 2rem;">🏆</span>
            <div>
                <div style="font-weight: bold; color: #fbbf24;">إنجاز جديد!</div>
                <div>${achievementName} +${xpReward} XP</div>
            </div>
        `;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.classList.add('fade-out');
            setTimeout(() => toast.remove(), 3000);
        }, 3000);
    }

    function checkAchievements() {
        let totalXPAdded = 0;
        
        let hasFirst100 = basicSkills.some(s => normalProgress[s] === 100) || 
            specialSkillsOrder.some(s => {
                for (let sub in s.subSkills) {
                    let levelsArr = s.subSkills[sub];
                    let current = specialProgress[s.name]?.[sub];
                    if (current === levelsArr[levelsArr.length-1]) return true;
                }
                return false;
            });
        
        if (!achievements[0].achieved && hasFirst100) {
            achievements[0].achieved = true;
            totalXPAdded += achievements[0].xpReward;
            showAchievement(achievements[0].name, achievements[0].xpReward);
        }
        
        let completedCount = basicSkills.filter(s => normalProgress[s] === 100).length;
        specialSkillsOrder.forEach(s => {
            let allComplete = true;
            for (let sub in s.subSkills) {
                let levelsArr = s.subSkills[sub];
                if (specialProgress[s.name]?.[sub] !== levelsArr[levelsArr.length-1]) allComplete = false;
            }
            if (allComplete) completedCount++;
        });
        
        if (!achievements[1].achieved && completedCount >= 5) {
            achievements[1].achieved = true;
            totalXPAdded += achievements[1].xpReward;
            showAchievement(achievements[1].name, achievements[1].xpReward);
        }
        
        if (!achievements[2].achieved && completedCount >= 10) {
            achievements[2].achieved = true;
            totalXPAdded += achievements[2].xpReward;
            showAchievement(achievements[2].name, achievements[2].xpReward);
        }
        
        let allNormalComplete = basicSkills.every(s => normalProgress[s] === 100);
        if (!achievements[3].achieved && allNormalComplete) {
            achievements[3].achieved = true;
            totalXPAdded += achievements[3].xpReward;
            showAchievement(achievements[3].name, achievements[3].xpReward);
        }
        
        let quranComplete = specialProgress["📖 حفظ القرآن الكريم"]?.["الحفظ الجديد"] === "26-30 جزء" && 
            specialProgress["📖 حفظ القرآن الكريم"]?.["المراجعة"] === "متقن";
        if (!achievements[4].achieved && quranComplete) {
            achievements[4].achieved = true;
            totalXPAdded += achievements[4].xpReward;
            showAchievement(achievements[4].name, achievements[4].xpReward);
        }
        
        if (totalXPAdded > 0) {
            userXP += totalXPAdded;
            localStorage.setItem("userXP", userXP);
            localStorage.setItem("achievements", JSON.stringify(achievements));
            updateRank();
        }
    }

    function refreshXP() {
        let newXP = calculateTotalXP();
        let achievementsTotalXP = achievements.filter(a => a.achieved).reduce((sum, a) => sum + a.xpReward, 0);
        newXP += achievementsTotalXP;
        
        if (newXP !== userXP) {
            userXP = newXP;
            localStorage.setItem("userXP", userXP);
            updateRank();
            checkAchievements();
        }
    }

    function getNormalResourceKey(skill) { return `normal_${skill}`; }
    function getSpecialResourceKey(skill, sub, lvl) { return `special_${skill}_${sub}_${lvl}`; }
    
    function saveAll() {
        localStorage.setItem("normalProgress", JSON.stringify(normalProgress));
        localStorage.setItem("specialProgress", JSON.stringify(specialProgress));
        localStorage.setItem("allResources", JSON.stringify(resources));
        localStorage.setItem("learningTasks", JSON.stringify(tasks));
        localStorage.setItem("userXP", userXP);
        localStorage.setItem("achievements", JSON.stringify(achievements));
    }
    
    function addNormalResource(skill) {
        let inp = document.getElementById(`normal-res-${skill.replace(/\s/g, '')}`);
        if(!inp || !inp.value.trim()) return;
        let url = inp.value.trim();
        if(!url.startsWith("http")) url = "https://"+url;
        let key = getNormalResourceKey(skill);
        if(!resources[key]) resources[key] = [];
        resources[key].push(url);
        saveAll(); renderSkills(); updateStats(); refreshXP();
        inp.value = "";
    }
    
    function deleteNormalResource(skill, idx) {
        if(confirm("⚠️ هل أنت متأكد من حذف هذا الرابط نهائياً؟")){
            let key = getNormalResourceKey(skill);
            if(resources[key]) resources[key].splice(idx,1);
            if(resources[key]?.length===0) delete resources[key];
            saveAll(); renderSkills(); updateStats(); refreshXP();
        }
    }
    
    function deleteAllNormalResources(skill) {
        if(confirm(`⚠️ هل تريد حذف جميع روابط "${skill}" نهائياً؟`)){
            delete resources[getNormalResourceKey(skill)];
            saveAll(); renderSkills(); updateStats(); refreshXP();
        }
    }
    
    function addSpecialResource(skill, sub, lvl) {
        let inp = document.getElementById(`special-res-${skill.replace(/\s/g, '')}-${sub}`);
        if(!inp || !inp.value.trim()) return;
        let url = inp.value.trim();
        if(!url.startsWith("http")) url = "https://"+url;
        let key = getSpecialResourceKey(skill, sub, lvl);
        if(!resources[key]) resources[key] = [];
        resources[key].push(url);
        saveAll(); renderSkills(); updateStats(); refreshXP();
        inp.value = "";
    }
    
    function deleteSpecialResource(skill, sub, lvl, idx) {
        if(confirm("⚠️ هل أنت متأكد من حذف هذا الرابط نهائياً؟")){
            let key = getSpecialResourceKey(skill, sub, lvl);
            if(resources[key]) resources[key].splice(idx,1);
            if(resources[key]?.length===0) delete resources[key];
            saveAll(); renderSkills(); updateStats(); refreshXP();
        }
    }
    
    function deleteAllSpecialLevel(skill, sub, lvl) {
        if(confirm(`⚠️ هل تريد حذف جميع روابط "${skill} - ${sub} - ${lvl}" نهائياً؟`)){
            delete resources[getSpecialResourceKey(skill, sub, lvl)];
            saveAll(); renderSkills(); updateStats(); refreshXP();
        }
    }
    
    function resetNormalSkill(skill) {
        if(confirm(`🔄 إعادة ضبط "${skill}" إلى 0%؟`)){ 
            normalProgress[skill]=0; 
            saveAll(); renderSkills(); updateStats(); refreshXP();
        }
    }
    
    function resetSubProgress(skill, sub, arr) {
        if(confirm(`🔄 إعادة ضبط تقدم "${skill} - ${sub}" إلى المستوى الأول (${arr[0]})؟`)){
            specialProgress[skill][sub] = arr[0];
            saveAll(); renderSkills(); updateStats(); refreshXP();
        }
    }
    
    function updateStats() {
        let totalCount = 0, totalSum = 0;
        basicSkills.forEach(s => { totalSum += normalProgress[s] || 0; totalCount++; });
        specialSkillsOrder.forEach(sk => {
            let subSum=0, subC=0;
            for(let sub in sk.subSkills){
                let lvl = specialProgress[sk.name]?.[sub];
                let arr = sk.subSkills[sub];
                if(lvl && arr.includes(lvl)){
                    let idx = arr.indexOf(lvl);
                    subSum += (idx/(arr.length-1))*100;
                }
                subC++;
            }
            if(subC){ totalSum += subSum; totalCount++; }
        });
        let avg = totalCount? Math.round(totalSum/totalCount):0;
        let completed = basicSkills.filter(s => normalProgress[s]===100).length;
        specialSkillsOrder.forEach(sk => {
            let ok=true;
            for(let sub in sk.subSkills){
                let arr = sk.subSkills[sub];
                if(specialProgress[sk.name]?.[sub] !== arr[arr.length-1]) ok=false;
            }
            if(ok) completed++;
        });
        let tasksDone = tasks.filter(t=>t.done).length;
        document.getElementById("statsArea").innerHTML = `
            <div class="stat-box">📊 متوسط التقدم: ${avg}%</div>
            <div class="stat-box">🏆 مهارات كاملة: ${completed}/${totalCount}</div>
            <div class="stat-box">✅ مهام منجزة: ${tasksDone}/${tasks.length}</div>
        `;
    }
    
    function renderSkills() {
        const grid = document.getElementById("skillsGrid");
        if(!grid) return;
        grid.innerHTML = "";
        
        basicSkills.forEach(skill => {
            let cur = normalProgress[skill] || 0;
            let resKey = getNormalResourceKey(skill);
            let resList = resources[resKey] || [];
            let levelsHtml = normalLevels.map(lvl => `<button class="level-btn ${cur===lvl ? 'active-level' : ''}" data-skill="${skill}" data-level="${lvl}">${lvl}%</button>`).join('');
            let resourcesHtml = resList.map((r,i)=>`<li class="resource-item"><a href="${r}" target="_blank" class="resource-link">📖 ${r.length>35?r.slice(0,35)+'...':r}</a><button class="delete-normal-resource" data-skill="${skill}" data-idx="${i}">✖</button></li>`).join('');
            let card = document.createElement("div"); card.className="skill-card";
            card.innerHTML = `
                <div class="skill-header"><span class="skill-name">${skill}</span><button class="reset-skill-btn" data-skill-normal="${skill}">🔄 إعادة ضبط التقدم</button></div>
                <div class="level-buttons">${levelsHtml}</div>
                <div class="shared-resource-section"><div class="shared-resource-label">📚 مصادر مشتركة:</div>
                <div class="resource-input-group"><input type="text" id="normal-res-${skill.replace(/\s/g, '')}" class="resource-input" placeholder="رابط فيديو/ملف"><button class="add-normal-resource" data-skill="${skill}">➕ أضف</button>${resList.length?`<button class="reset-links-btn" data-skill-normal-resetlinks="${skill}" style="background:#6d28d9;">🗑️ مسح الكل</button>`:''}</div>
                <ul class="resources-list">${resourcesHtml}</ul></div>
            `;
            grid.appendChild(card);
        });
        
        specialSkillsOrder.forEach(skillObj => {
            let card = document.createElement("div"); card.className="skill-card";
            let inner = `<div class="skill-header"><span class="skill-name">${skillObj.name}</span></div>`;
            for(let [subName, levelsArr] of Object.entries(skillObj.subSkills)){
                let current = specialProgress[skillObj.name]?.[subName] || levelsArr[0];
                let btns = levelsArr.map(lvl => `<button class="level-btn special-level ${current===lvl?'active-level':''}" data-skill-name="${skillObj.name}" data-sub-skill="${subName}" data-level="${lvl}">${lvl}</button>`).join('');
                let resKey = getSpecialResourceKey(skillObj.name, subName, current);
                let resList = resources[resKey] || [];
                let resHtml = resList.map((r,i)=>`<li class="resource-item"><a href="${r}" target="_blank" class="resource-link">📖 ${r.length>35?r.slice(0,35)+'...':r}</a><button class="delete-special-resource" data-skill-name="${skillObj.name}" data-sub-skill="${subName}" data-level="${current}" data-idx="${i}">✖</button></li>`).join('');
                inner += `<div class="sub-skill-block"><div class="sub-skill-title"><span>📌 ${subName}</span><div><button class="level-control-btn reset-progress reset-progress-special" data-skill-name="${skillObj.name}" data-sub-skill="${subName}">🔄 إعادة ضبط التقدم</button><button class="level-control-btn reset-links reset-links-special" data-skill-name="${skillObj.name}" data-sub-skill="${subName}" data-level="${current}">🗑️ مسح روابط هذا المستوى</button></div></div>
                <div class="level-buttons">${btns}</div>
                <div class="resource-section-special"><div class="resource-label" style="font-size:0.7rem;">📚 روابط خاصة بهذا المستوى (${current}):</div>
                <div class="resource-input-group"><input type="text" id="special-res-${skillObj.name.replace(/\s/g, '')}-${subName}" class="resource-input" placeholder="رابط فيديو/تلاوة/تفسير"><button class="add-special-resource" data-skill-name="${skillObj.name}" data-sub-skill="${subName}" data-level="${current}">➕ أضف</button></div>
                <ul class="resources-list">${resHtml}</ul></div></div>`;
            }
            card.innerHTML = inner;
            grid.appendChild(card);
        });
        
        attachEvents();
    }
    
    function attachEvents() {
        document.querySelectorAll(".level-btn[data-skill]").forEach(btn=>btn.addEventListener("click",e=>{
            let s=btn.getAttribute("data-skill"), lvl=parseInt(btn.getAttribute("data-level"));
            if(s){ normalProgress[s]=lvl; saveAll(); renderSkills(); updateStats(); refreshXP(); }
        }));
        document.querySelectorAll(".reset-skill-btn[data-skill-normal]").forEach(btn=>btn.addEventListener("click",e=>resetNormalSkill(btn.getAttribute("data-skill-normal"))));
        document.querySelectorAll(".add-normal-resource").forEach(btn=>btn.addEventListener("click",e=>addNormalResource(btn.getAttribute("data-skill"))));
        document.querySelectorAll(".delete-normal-resource").forEach(btn=>btn.addEventListener("click",e=>deleteNormalResource(btn.getAttribute("data-skill"), parseInt(btn.getAttribute("data-idx")))));
        document.querySelectorAll(".reset-links-btn[data-skill-normal-resetlinks]").forEach(btn=>btn.addEventListener("click",e=>deleteAllNormalResources(btn.getAttribute("data-skill-normal-resetlinks"))));
        
        document.querySelectorAll(".special-level").forEach(btn=>btn.addEventListener("click",e=>{
            let sn=btn.getAttribute("data-skill-name"), sub=btn.getAttribute("data-sub-skill"), lvl=btn.getAttribute("data-level");
            if(sn && sub){ specialProgress[sn][sub]=lvl; saveAll(); renderSkills(); updateStats(); refreshXP(); }
        }));
        document.querySelectorAll(".reset-progress-special").forEach(btn=>btn.addEventListener("click",e=>{
            let sn=btn.getAttribute("data-skill-name"), sub=btn.getAttribute("data-sub-skill");
            let found = specialSkillsOrder.find(s=>s.name===sn);
            if(found && found.subSkills[sub]) resetSubProgress(sn, sub, found.subSkills[sub]);
        }));
        document.querySelectorAll(".reset-links-special").forEach(btn=>btn.addEventListener("click",e=>{
            let sn=btn.getAttribute("data-skill-name"), sub=btn.getAttribute("data-sub-skill"), lvl=btn.getAttribute("data-level");
            if(sn && sub && lvl) deleteAllSpecialLevel(sn, sub, lvl);
        }));
        document.querySelectorAll(".add-special-resource").forEach(btn=>btn.addEventListener("click",e=>{
            let sn=btn.getAttribute("data-skill-name"), sub=btn.getAttribute("data-sub-skill"), lvl=btn.getAttribute("data-level");
            addSpecialResource(sn, sub, lvl);
        }));
        document.querySelectorAll(".delete-special-resource").forEach(btn=>btn.addEventListener("click",e=>{
            let sn=btn.getAttribute("data-skill-name"), sub=btn.getAttribute("data-sub-skill"), lvl=btn.getAttribute("data-level"), idx=parseInt(btn.getAttribute("data-idx"));
            deleteSpecialResource(sn, sub, lvl, idx);
        }));
    }
    
    function renderTasks() {
        let ul = document.getElementById("taskList");
        if(!ul) return;
        if(tasks.length===0){ ul.innerHTML="<li style='text-align:center;'>✨ لا توجد مهام | أضف مهمة جديدة</li>"; return; }
        ul.innerHTML = tasks.map((t,i)=>`<li style="text-decoration:${t.done?'line-through':'none'}; opacity:${t.done?0.6:1}"><span>${t.name}</span><div><button class="toggleTask" data-idx="${i}">${t.done?'↩️ تراجع':'✔ أنجزت'}</button><button class="deleteTask" data-idx="${i}">🗑</button></div></li>`).join('');
        document.querySelectorAll(".toggleTask").forEach(btn=>btn.addEventListener("click",e=>{let idx=btn.getAttribute("data-idx"); tasks[idx].done=!tasks[idx].done; saveAll(); renderTasks(); updateStats(); refreshXP();}));
        document.querySelectorAll(".deleteTask").forEach(btn=>btn.addEventListener("click",e=>{if(confirm("⚠️ حذف المهمة؟")){ let idx=btn.getAttribute("data-idx"); tasks.splice(idx,1); saveAll(); renderTasks(); updateStats(); refreshXP();}}));
    }
    
    function initData() {
        basicSkills.forEach(s => { if (normalProgress[s] === undefined) normalProgress[s] = 0; });
        specialSkillsOrder.forEach(skill => {
            if (!specialProgress[skill.name]) specialProgress[skill.name] = {};
            for (let sub in skill.subSkills) {
                if (!specialProgress[skill.name][sub]) {
                    specialProgress[skill.name][sub] = skill.subSkills[sub][0];
                }
            }
        });
    }
    
    document.getElementById("addTask")?.addEventListener("click",()=>{
        let inp=document.getElementById("taskName");
        if(inp.value.trim()){ tasks.push({name:inp.value.trim(),done:false}); saveAll(); renderTasks(); updateStats(); refreshXP(); inp.value=""; }
    });
    
    document.getElementById("resetAllBtn")?.addEventListener("click",()=>{
        if(confirm("⚠️ تحذير نهائي: سيتم حذف كل تقدم المهارات، جميع المصادر، وجميع المهام. هل أنت متأكد؟")){
            basicSkills.forEach(s=>normalProgress[s]=0);
            specialSkillsOrder.forEach(skill=>{
                for(let sub in skill.subSkills) specialProgress[skill.name][sub]=skill.subSkills[sub][0];
            });
            resources={}; tasks=[]; userXP=0; achievements = ACHIEVEMENTS.map(a => ({ ...a, achieved: false }));
            saveAll(); renderSkills(); renderTasks(); updateStats(); refreshXP();
        }
    });
    
    initData(); renderSkills(); renderTasks(); updateStats(); refreshXP();
</script>
</body>
</html>
